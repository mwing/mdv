name: release

on:
  push:
    # Plain semver only: a pre-release tag would become "latest" for the
    # download URL while go install skips it.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod names the oldest Go that builds; releases need a supported one.
          go-version: stable
          cache: false
      - name: Test
        run: go vet ./... && go test ./...
      - name: Build
        run: |
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${target%/*}
            arch=${target#*/}
            dir="dist/${os}_${arch}"
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o "$dir/mdv" .
            cp LICENSE README.md "$dir/"
            # Unversioned names keep releases/latest/download/<name> stable.
            tar -C "$dir" -czf "dist/mdv_${os}_${arch}.tar.gz" mdv LICENSE README.md
          done
          cd dist && sha256sum mdv_*.tar.gz > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/mdv_*.tar.gz dist/checksums.txt --generate-notes --verify-tag
